name: "Email Service Infrastructure Change Management Pipeline with GitHub Actions"

on:
  pull_request:
    paths:
      - src/email_service/**
  push:
    branches:
      - main
      - dev
    paths:
      - src/email_service/**

env:
  TF_LOG: INFO
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_DIR: ./src/email_service/terraform
  GREP_FILTER: >-
    grep -v -E '^[[:space:]]*(module\.|random_|aws_).*: (Creating|Creation complete|Still creating|Modifications complete|Destroying|Destruction complete|Reading\.\.\.|Plan:|Read complete after)' |
    grep -v -E '^\[.*\][[:space:]]*module\..*$' |
    grep -v '^[0-9]+[[:space:]]' |
    grep -v 'Creation complete after' |
    grep -v 'Still creating\.\.\.' |
    grep -v ': Reading\.\.\.' |
    grep -v ': Read complete' |
    grep -v 'Refreshing state\.\.\.'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: write

jobs:
  preview:
    name: "Deploy Preview Environment"
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Print Debug Information"
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Merged: ${{ github.event.pull_request.merged }}"

          # Set commit SHA for pull request
          if [[ "${{ github.event.pull_request.head.sha }}" != "" ]]; then
            COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          else
            COMMIT_SHA="unknown-sha"
          fi

          echo "PULL_REQUEST_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u '+%Y-%m-%dT%H-%M-%SZ')" >> $GITHUB_ENV

      # Disable Terraform command output logging to prevent credential leaks
      - name: Disable Terraform command logging
        run: |
          echo "TF_CLI_ARGS=-no-color" >> $GITHUB_ENV
          echo "TF_LOG=" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for git diff

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="preview.tfbackend" -reconfigure
        working-directory: ${{ env.TF_DIR }}

      # Database Migration Steps (BEFORE Terraform Apply to ensure schema is ready)
      - name: Check for Migration Changes
        id: check-migrations
        run: |
          # Check if migrations directory has changes
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep "src/email_service/db/migrations" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "has_migration_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::Database migration files have changed. Manual approval required."
          else
            echo "has_migration_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No migration changes detected."
          fi

      - name: Request Migration Approval
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "🔐 Database Migration Approval Required - PR #${{ env.PULL_REQUEST_NUMBER }}"
          issue-body: |
            ## Database Migration Approval Required

            **Pull Request:** #${{ env.PULL_REQUEST_NUMBER }}
            **Environment:** Preview
            **Triggered by:** @${{ github.actor }}
            **Commit:** ${{ env.COMMIT_SHA }}

            ### Changed Migration Files:
            ```
            $(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep "src/email_service/db/migrations")
            ```

            ### ⚠️ Important
            - Review the migration files carefully before approving
            - Ensure you have tested the migration in a dev environment
            - Approval will trigger the migration execution

            **To approve:** Comment with `/approve`
            **To reject:** Comment with `/deny`
          exclude-workflow-initiator-as-approver: false

      - name: Setup Python with uv
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials for Migration
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1 # Preview environment uses us-west-1

      - name: Get DB Credentials from RDS
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        id: get-db-creds
        run: |
          # Get DB cluster ARN and master user secret ARN from RDS
          # The secret is managed by RDS (manage_master_user_password = true)
          DB_CLUSTER_ID="preview-email-service-tpet-aurora-postgresql-v2"

          DB_CLUSTER_ARN=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$DB_CLUSTER_ID" \
            --query 'DBClusters[0].DBClusterArn' --output text)

          DB_SECRET_ARN=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$DB_CLUSTER_ID" \
            --query 'DBClusters[0].MasterUserSecret.SecretArn' --output text)

          echo "::add-mask::$DB_CLUSTER_ARN"
          echo "::add-mask::$DB_SECRET_ARN"

          echo "DB_CLUSTER_ARN=$DB_CLUSTER_ARN" >> $GITHUB_ENV
          echo "DB_SECRET_ARN=$DB_SECRET_ARN" >> $GITHUB_ENV

      - name: Wake Up Aurora Serverless (Health Check)
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          chmod +x ./scripts/wait_for_aurora_serverless.sh
          ./scripts/wait_for_aurora_serverless.sh \
            "https://preview-email-service-internal-api-tpet.aws-educate.tw/preview/email-service/health" \
            30 \
            10

      - name: Run Database Migration
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        id: run-migration
        run: |
          echo "::group::Running Database Migration"
          uv run src/email_service/db/run_migration_via_rds_data_api.py
          echo "::endgroup::"
        env:
          AWS_REGION: us-west-1
          DB_CLUSTER_ARN: ${{ env.DB_CLUSTER_ARN }}
          DB_SECRET_ARN: ${{ env.DB_SECRET_ARN }}
          DB_NAME: email_service_db

      - name: Check Migration Result
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          if [[ "${{ steps.run-migration.outcome }}" != "success" ]]; then
            echo "::error::Database migration failed. Deployment aborted."
            exit 1
          else
            echo "::notice::Database migration completed successfully."
          fi

      # Terraform Apply (AFTER DB Migration to ensure schema is ready for new Lambda code)
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file='preview.tfvars' 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -var-file='preview.tfvars' -parallelism=1 -auto-approve 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1 # Preview environment region

      # Enhanced security for token handling
      - name: Get Postman Service Account Token
        id: get-token
        run: |
          # Mask all outputs
          set +x

          # Get secret and mask the response
          SECRET_RESPONSE=$(aws secretsmanager get-secret-value \
            --secret-id "aws-educate-tpet/preview/service-accounts/postman/access-token" \
            --query 'SecretString' \
            --output text)
          echo "::add-mask::$SECRET_RESPONSE"

          # Parse and mask the token
          ACCESS_TOKEN=$(echo $SECRET_RESPONSE | jq -r '.access_token')
          echo "::add-mask::$ACCESS_TOKEN"

          # Store token securely
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV

          # Validate without exposing token
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Error: Failed to retrieve access token"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Wait for API Gateway Deployment
        run: |
          MAX_RETRIES=10
          RETRY_INTERVAL=5
          COUNTER=0

          HEALTH_CHECK_URL="https://preview-email-service-internal-api-tpet.aws-educate.tw/preview/email-service/health"

          echo "Checking health endpoint: ${HEALTH_CHECK_URL}"

          while [ $COUNTER -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_CHECK_URL}")

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ API Gateway is ready!"
              exit 0
            fi

            echo "API not ready yet (Status: ${HTTP_STATUS}). Retrying in ${RETRY_INTERVAL} seconds..."
            sleep $RETRY_INTERVAL
            COUNTER=$((COUNTER + 1))
          done

          echo "❌ API Gateway failed to become ready within the timeout period"
          exit 1

      # Enhanced security for Newman tests with report naming
      - name: Run API Tests
        id: newman
        run: |
          # Create report directory with meaningful name
          REPORT_DIR="newman/pr_${{ env.PULL_REQUEST_NUMBER }}_${{ env.TIMESTAMP }}_${{ env.COMMIT_SHA }}"
          mkdir -p $REPORT_DIR

          # Create temporary environment file that combines base environment and token
          TEMP_ENV_FILE=$(mktemp)

          # Merge base environment with token and contextual information
          jq -s '.[0].values + [
            {"key":"access_token", "value":"${{ env.ACCESS_TOKEN }}"},
            {"key":"pull_request_number", "value":"${{ env.PULL_REQUEST_NUMBER }}"},
            {"key":"commit_sha", "value":"${{ env.COMMIT_SHA }}"},
            {"key":"timestamp", "value":"${{ env.TIMESTAMP }}"}
          ] | {values: .}' \
            ./tests/email_service/api_regression/email_service_preview_environment.json \
            > $TEMP_ENV_FILE

          # Run tests with combined environment file
          newman run ./tests/email_service/api_regression/email_service_regression_test_collection.json \
            --environment $TEMP_ENV_FILE \
            --reporters cli,htmlextra \
            --reporter-htmlextra-skipHeaders Authorization \
            --reporter-htmlextra-export "$REPORT_DIR/report.html" \
            --silent

          # Cleanup
          rm -f $TEMP_ENV_FILE
        continue-on-error: true

      - name: Check Newman Test Results
        if: always()
        run: |
          if [[ ${{ steps.newman.outcome }} != "success" ]]; then
            echo "❌ Newman tests failed."
            exit 1
          else
            echo "✅ Newman tests passed."
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results_pr${{ env.PULL_REQUEST_NUMBER }}_${{ env.COMMIT_SHA }}_${{ env.TIMESTAMP }}
          path: newman/

      - name: Get Artifact URL
        if: always()
        id: get-artifact-url
        run: |

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)


          ARTIFACT_NAME="newman-test-results_pr${{ env.PULL_REQUEST_NUMBER }}_${{ env.COMMIT_SHA }}_${{ env.TIMESTAMP }}"
          ARTIFACT_ID=$(echo "$ARTIFACTS" | jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name==$name).id')


          echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' &&
                      comment.body.includes('[Email Service]') &&
                      (comment.body.includes('Deployment Status') ||
                      comment.body.includes('Test Results'));
            });

            const tfExitCode = '${{ steps.apply.outcome }}' === 'success' ? 0 : 1;
            const testExitCode = '${{ steps.newman.outcome }}' === 'success' ? 0 : 1;

            // Get short SHA
            const shortSHA = '${{ env.COMMIT_SHA }}'.substring(0, 6);

            // Combine artifact URL
            const artifactUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${process.env.ARTIFACT_ID}`;

            let output = `### [Email Service] Preview Deployment Status\n\n`;
            output += `| Service | Environment | Commit | Status | Details |\n`;
            output += `|:--------|:------------|:-------|:-------|:--------|\n`;
            output += `| Email Service | Preview | \`${shortSHA}\` | ${tfExitCode === 0 ? '✅' : '❌'} | ${
              tfExitCode === 0
                ? 'Successfully deployed'
                : `[Check deployment logs](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            } |\n`;

            output += `\n### Test Results\n\n`;
            output += `| Test Suite | Status | Report |\n`;
            output += `|:-----------|:-------|:--------|\n`;
            output += `| API Tests | ${testExitCode === 0 ? '✅' : '❌'} | [Download Report](${artifactUrl}) |\n`;

            output += `\n---\n`;
            output += `🔍 **Details**\n`;
            output += `- Run ID: \`${context.runId}\`\n`;
            output += `- Triggered by: @${{ github.actor }}\n`;
            output += `- Environment: Preview\n`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output,
              });
            }

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: "[Email Service] Preview environment deployment"
          job_name: Deploy Preview Environment
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        if: always()

  deploy:
    name: "Deploy to Target Environment"
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: "Print Debug Information"
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Merged: ${{ github.event.pull_request.merged }}"

      # Disable Terraform command output logging
      - name: Disable Terraform command logging
        run: |
          echo "TF_CLI_ARGS=-no-color" >> $GITHUB_ENV
          echo "TF_LOG=" >> $GITHUB_ENV

      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "TF_VARS_FILE=prod.tfvars" >> $GITHUB_ENV
            echo "AWS_REGION=ap-northeast-1" >> $GITHUB_ENV  # Tokyo for prod
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "TF_VARS_FILE=dev.tfvars" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV  # N. Virginia for dev
          else
            echo "Unsupported branch: ${{ github.ref }}"
            exit 1
          fi

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="${{ env.ENVIRONMENT }}.tfbackend" -reconfigure
        working-directory: ${{ env.TF_DIR }}

      # Database Migration Steps (BEFORE Terraform Apply to ensure schema is ready)
      - name: Check for Migration Changes
        id: check-migrations
        run: |
          # Check if migrations directory has changes in the last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "src/email_service/db/migrations" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "has_migration_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::Database migration files have changed. Manual approval required."
          else
            echo "has_migration_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No migration changes detected."
          fi

      - name: Request Migration Approval
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Database Migration Approval Required - ${{ env.ENVIRONMENT }} Environment"
          issue-body: |
            ## Database Migration Approval Required

            **Environment:** ${{ env.ENVIRONMENT }}
            **Branch:** ${{ github.ref }}
            **Triggered by:** @${{ github.actor }}
            **Commit:** ${{ github.sha }}

            ### Changed Migration Files:
            ```
            $(git diff --name-only HEAD~1 HEAD | grep "src/email_service/db/migrations")
            ```

            ### Important
            - Review the migration files carefully before approving
            - This is a **${{ env.ENVIRONMENT }}** environment deployment
            - Approval will trigger the migration execution

            **To approve:** Comment with `/approve`
            **To reject:** Comment with `/deny`
          exclude-workflow-initiator-as-approver: false

      - name: Setup Python with uv
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials for Migration
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get DB Credentials from RDS
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        id: get-db-creds
        run: |
          # Get DB cluster ARN and master user secret ARN from RDS
          # The secret is managed by RDS (manage_master_user_password = true)
          DB_CLUSTER_ID="${{ env.ENVIRONMENT }}-email-service-tpet-aurora-postgresql-v2"

          DB_CLUSTER_ARN=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$DB_CLUSTER_ID" \
            --query 'DBClusters[0].DBClusterArn' --output text)

          DB_SECRET_ARN=$(aws rds describe-db-clusters \
            --db-cluster-identifier "$DB_CLUSTER_ID" \
            --query 'DBClusters[0].MasterUserSecret.SecretArn' --output text)

          echo "::add-mask::$DB_CLUSTER_ARN"
          echo "::add-mask::$DB_SECRET_ARN"

          echo "DB_CLUSTER_ARN=$DB_CLUSTER_ARN" >> $GITHUB_ENV
          echo "DB_SECRET_ARN=$DB_SECRET_ARN" >> $GITHUB_ENV

      - name: Set Health Check URL
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          # Set health check URL based on environment
          if [[ "${{ env.ENVIRONMENT }}" == "prod" ]]; then
            HEALTH_CHECK_URL="https://email-service-internal-api-tpet.aws-educate.tw/prod/email-service/health"
          else
            HEALTH_CHECK_URL="https://dev-email-service-internal-api-tpet.aws-educate.tw/dev/email-service/health"
          fi
          echo "HEALTH_CHECK_URL=$HEALTH_CHECK_URL" >> $GITHUB_ENV

      - name: Wake Up Aurora Serverless (Health Check)
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          chmod +x ./scripts/wait_for_aurora_serverless.sh
          ./scripts/wait_for_aurora_serverless.sh "${{ env.HEALTH_CHECK_URL }}" 30 10

      - name: Run Database Migration
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        id: run-migration
        run: |
          echo "::group::Running Database Migration for ${{ env.ENVIRONMENT }}"
          uv run src/email_service/db/run_migration_via_rds_data_api.py
          echo "::endgroup::"
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          DB_CLUSTER_ARN: ${{ env.DB_CLUSTER_ARN }}
          DB_SECRET_ARN: ${{ env.DB_SECRET_ARN }}
          DB_NAME: email_service_db

      - name: Check Migration Result
        if: steps.check-migrations.outputs.has_migration_changes == 'true'
        run: |
          if [[ "${{ steps.run-migration.outcome }}" != "success" ]]; then
            echo "::error::Database migration failed for ${{ env.ENVIRONMENT }}. Deployment aborted."
            exit 1
          else
            echo "::notice::Database migration completed successfully for ${{ env.ENVIRONMENT }}."
          fi

      # Terraform Apply (AFTER DB Migration to ensure schema is ready for new Lambda code)
      - name: Terraform Destroy (Cleanup)
        id: destroy
        run: |
          terraform destroy -auto-approve -var-file='${{ env.TF_VARS_FILE }}' 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file='${{ env.TF_VARS_FILE }}' 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -var-file='${{ env.TF_VARS_FILE }}' -auto-approve 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: "[Email Service] ${{ env.ENVIRONMENT }} environment deployment"
          job_name: Deploy to Target Environment
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        if: always()
