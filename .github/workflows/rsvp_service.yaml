name: "RSVP Service Infrastructure Change Management Pipeline with GitHub Actions"

on:
  pull_request:
    paths:
      - src/rsvp_service/**
  push:
    branches:
      - main
      - dev
    paths:
      - src/rsvp_service/**

env:
  SERVICE_NAME: RSVP Service
  SERVICE_LABEL: service/rsvp
  TF_LOG: INFO
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_DIR: ./src/rsvp_service/terraform
  DOCKER_API_VERSION: "1.44"
  GREP_FILTER: >-
    grep -v -E '^[[:space:]]*(module\.|random_|aws_).*: (Creating|Creation complete|Still creating|Modifications complete|Destroying|Destruction complete|Reading\.\.\.|Plan:|Read complete after)' |
    grep -v -E '^\[.*\][[:space:]]*module\..*$' |
    grep -v '^[0-9]+[[:space:]]' |
    grep -v 'Creation complete after' |
    grep -v 'Still creating\.\.\.' |
    grep -v ': Reading\.\.\.' |
    grep -v ': Read complete' |
    grep -v 'Refreshing state\.\.\.'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  checks: write

jobs:
  preview:
    name: "Deploy Preview Environment"
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: "Print Debug Information"
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Merged: ${{ github.event.pull_request.merged }}"

          # Set commit SHA for pull request
          if [[ "${{ github.event.pull_request.head.sha }}" != "" ]]; then
            COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          else
            COMMIT_SHA="unknown-sha"
          fi

          echo "PULL_REQUEST_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$COMMIT_SHA" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date -u '+%Y-%m-%dT%H-%M-%SZ')" >> $GITHUB_ENV

      - name: Disable Terraform command logging
        run: |
          echo "TF_CLI_ARGS=-no-color" >> $GITHUB_ENV
          echo "TF_LOG=" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for git diff

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="preview.tfbackend" -reconfigure
        working-directory: ${{ env.TF_DIR }}

      - name: Check for DynamoDB Changes
        id: check-dynamodb
        run: |
          # Check if DynamoDB-related Terraform files have changes
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep -E "src/rsvp_service/terraform/.*dynamodb.*\\.tf|src/rsvp_service/terraform/variables\\.tf" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "has_dynamodb_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::DynamoDB-related Terraform changes detected. Manual approval required."
          else
            echo "has_dynamodb_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No DynamoDB-related changes detected."
          fi

      - name: Check for Existing Approval Issue
        if: steps.check-dynamodb.outputs.has_dynamodb_changes == 'true'
        id: check-existing-issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueTitle = `🔐 [${{ env.SERVICE_NAME }}] DynamoDB Change Approval Required - Preview - PR #${{ env.PULL_REQUEST_NUMBER }}`;

            // Search for ALL issues (open or closed) with the same title
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: `${{ env.SERVICE_LABEL }},env/preview,kind/dynamodb-change`,
              per_page: 100
            });

            const existingIssue = issues.find(issue => issue.title === issueTitle);

            if (existingIssue) {
              console.log(`Found existing approval issue #${existingIssue.number}`);
              core.setOutput('issue_exists', 'true');
              core.setOutput('issue_number', existingIssue.number);

              // Check if already approved (issue closed)
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number
              });

              const approved = comments.some(c =>
                c.body.toLowerCase().match(/^(approved|approve|lgtm|yes)$/m)
              );
              core.setOutput('already_approved', approved ? 'true' : 'false');
            } else {
              console.log('No existing approval issue found');
              core.setOutput('issue_exists', 'false');
              core.setOutput('already_approved', 'false');
            }
      - name: Request DynamoDB Change Approval
        if: steps.check-dynamodb.outputs.has_dynamodb_changes == 'true' && steps.check-existing-issue.outputs.issue_exists != 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "🔐 [${{ env.SERVICE_NAME }}] DynamoDB Change Approval Required - Preview - PR #${{ env.PULL_REQUEST_NUMBER }}"
          issue-body: |
            ## DynamoDB Change Approval Required

            **Service:** ${{ env.SERVICE_NAME }}
            **Pull Request:** #${{ env.PULL_REQUEST_NUMBER }}
            **Environment:** Preview
            **Triggered by:** @${{ github.actor }}
            **Commit:** ${{ env.COMMIT_SHA }}

            ### Changed DynamoDB-Related Terraform Files:
            ```
            $(git diff --name-only origin/${{ github.base_ref }} ${{ github.sha }} | grep -E "src/rsvp_service/terraform/.*dynamodb.*\\.tf|src/rsvp_service/terraform/variables\\.tf")
            ```

            ### ⚠️ Important
            - Review DynamoDB table/index changes carefully before approving
            - Ensure changes are safe for existing data and access patterns
            - Approval will allow Terraform to apply DynamoDB changes

            **To approve:** Comment with `approved`, `approve`, `lgtm`, or `yes`
            **To reject:** Comment with `denied`, `deny`, or `no`
          exclude-workflow-initiator-as-approver: false
          additional-approved-words: ""
          additional-denied-words: ""

      - name: Wait for Existing Approval
        if: steps.check-dynamodb.outputs.has_dynamodb_changes == 'true' && steps.check-existing-issue.outputs.issue_exists == 'true' && steps.check-existing-issue.outputs.already_approved != 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "🔐 [${{ env.SERVICE_NAME }}] DynamoDB Change Approval Required - Preview - PR #${{ env.PULL_REQUEST_NUMBER }}"
          issue-body: "Waiting for existing approval..."
          exclude-workflow-initiator-as-approver: false

      - name: Skip Approval (Already Approved)
        if: steps.check-dynamodb.outputs.has_dynamodb_changes == 'true' && steps.check-existing-issue.outputs.already_approved == 'true'
        run: |
          echo "::notice::DynamoDB changes already approved in issue #${{ steps.check-existing-issue.outputs.issue_number }}. Proceeding."

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file='preview.tfvars' 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -var-file='preview.tfvars' -parallelism=1 -auto-approve 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      # - name: Configure AWS credentials
