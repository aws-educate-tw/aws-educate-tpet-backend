      #     echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_ENV

      - uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' &&
                      comment.body.includes('[${{ env.SERVICE_NAME }}]') &&
                      (comment.body.includes('Deployment Status') ||
                      comment.body.includes('Test Results'));
            });

            const tfExitCode = '${{ steps.apply.outcome }}' === 'success' ? 0 : 1;
            // const testExitCode = '${{ steps.newman.outcome }}' === 'success' ? 0 : 1;

            // Get short SHA
            const shortSHA = '${{ env.COMMIT_SHA }}'.substring(0, 6);
            // const artifactUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${process.env.ARTIFACT_ID}`;

            let output = `### [${{ env.SERVICE_NAME }}] Preview Deployment Status\n\n`;
            output += `| Service | Environment | Commit | Status | Details |\n`;
            output += `|:--------|:------------|:-------|:-------|:--------|\n`;
            output += `| ${{ env.SERVICE_NAME }} | Preview | \`${shortSHA}\` | ${tfExitCode === 0 ? '✅' : '❌'} | ${
              tfExitCode === 0
                ? 'Successfully deployed'
                : `[Check deployment logs](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            } |\n`;

            // output += `\n### Test Results\n\n`;
            // output += `| Test Suite | Status | Report |\n`;
            // output += `|:-----------|:-------|:--------|\n`;
            // output += `| API Tests | ${testExitCode === 0 ? '✅' : '❌'} | [Download Report](${artifactUrl}) |\n`;

            output += `\n---\n`;
            output += `🔍 **Details**\n`;
            output += `- Run ID: \`${context.runId}\`\n`;
            output += `- Triggered by: @${{ github.actor }}\n`;
            output += `- Environment: Preview\n`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output,
              });
            }

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: "[${{ env.SERVICE_NAME }}] Preview environment deployment"
          job_name: Deploy Preview Environment
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        if: always()

  deploy:
    name: "Deploy to Target Environment"
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: "Print Debug Information"
        run: |
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Merged: ${{ github.event.pull_request.merged }}"

      - name: Disable Terraform command logging
        run: |
          echo "TF_CLI_ARGS=-no-color" >> $GITHUB_ENV
          echo "TF_LOG=" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      - name: Set Environment Variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "TF_VARS_FILE=prod.tfvars" >> $GITHUB_ENV
            echo "AWS_REGION=ap-northeast-1" >> $GITHUB_ENV  # Tokyo for prod
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "TF_VARS_FILE=dev.tfvars" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV  # N. Virginia for dev
          else
            echo "Unsupported branch: ${{ github.ref }}"
            exit 1
          fi

      - name: Terraform Init
        id: init
        run: terraform init -backend-config="${{ env.ENVIRONMENT }}.tfbackend" -reconfigure
        working-directory: ${{ env.TF_DIR }}

      - name: Check for DynamoDB Changes
        id: check-dynamodb
        run: |
          # Check if DynamoDB-related Terraform files have changes in the last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E "src/rsvp_service/terraform/.*dynamodb.*\\.tf|src/rsvp_service/terraform/variables\\.tf" || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "has_dynamodb_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::DynamoDB-related Terraform changes detected. Manual approval required."
          else
            echo "has_dynamodb_changes=false" >> $GITHUB_OUTPUT
            echo "::notice::No DynamoDB-related changes detected."
          fi

      - name: Request DynamoDB Change Approval
        if: steps.check-dynamodb.outputs.has_dynamodb_changes == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "🔐 [${{ env.SERVICE_NAME }}] DynamoDB Change Approval Required - ${{ env.ENVIRONMENT }} - ${{ github.ref_name }}"
          issue-body: |
            ## DynamoDB Change Approval Required

            **Service:** ${{ env.SERVICE_NAME }}
            **Environment:** ${{ env.ENVIRONMENT }}
            **Branch:** ${{ github.ref }}
            **Triggered by:** @${{ github.actor }}
            **Commit:** ${{ github.sha }}

            ### Changed DynamoDB-Related Terraform Files:
            ```
            $(git diff --name-only HEAD~1 HEAD | grep -E "src/rsvp_service/terraform/.*dynamodb.*\\.tf|src/rsvp_service/terraform/variables\\.tf")
            ```

            ### ⚠️ Important
            - Review DynamoDB table/index changes carefully before approving
            - This is a **${{ env.ENVIRONMENT }}** environment deployment
            - Approval will allow Terraform to apply DynamoDB changes

            **To approve:** Comment with `approved`, `approve`, `lgtm`, or `yes`
            **To reject:** Comment with `denied`, `deny`, or `no`
          exclude-workflow-initiator-as-approver: false

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -var-file='${{ env.TF_VARS_FILE }}' 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -var-file='${{ env.TF_VARS_FILE }}' -parallelism=1 -auto-approve 2>&1 | ${{ env.GREP_FILTER }}
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: "[${{ env.SERVICE_NAME }}] ${{ env.ENVIRONMENT }} environment deployment"
          job_name: Deploy to Target Environment
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took,pullRequest
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}
        if: always()
